<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gusel Phone-Book</title>
    <!-- google fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- css link -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- add new contact button -->
      <div class="add-btn"><span>+</span></div>
      <!-- add new contact panel/modal -->
      <div class="add-contact-panel">
        <h1>Add new contact</h1>
        <div>
          <div class="input-box">
            <input
              type="text"
              name=""
              id=""
              placeholder="name"
              class="name_input"
            />
            <input
              type="tel"
              name=""
              id=""
              placeholder="number"
              class="number_input"
            />
          </div>
          <button class="add-contact-btn" type="submit">Add Contact</button>
        </div>
        <div class="close-add-contact-btn">X</div>
      </div>

      <div class="app-wrapper">
        <div class="links">
          <div class="contact-btn">
            <p>contacts</p>
          </div>

          <div class="call-btn"></div>
        </div>
        <!-- for contact section -->
        <div id="contact-lists">
          <!-- contact header -->
          <div class="header-title">
            <p>Contact</p>
            <span>...</span>
          </div>
          <!-- search bar -->
          <div class="search-bar">
            <!-- <img src="./imgs/search.png" alt="search icon" /> -->
            <input type="text" placeholder="search" class="search-input" />
          </div>
          <!-- contact list panel -->
          <div id="contact-lists-container"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./dist/script.js"></script>
  </body>
</html>
